<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS MLM — Admin VIP</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f3f4f6; color: #1f2937; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  
  .login-box { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .login-title { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 24px; color: #111827; }
  .login-title span { color: #f59e0b; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
  
  .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }

  #admin-screen { display: none; width: 100%; max-width: 1000px; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
  .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { font-size: 18px; font-weight: 800; color: #111827; }
  .nav-brand span { color: #f59e0b; }
  .btn-logout { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  
  .container { padding: 24px; }
  .web3-panel { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 16px; border-radius: 8px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .web3-status { font-size: 14px; font-weight: 600; color: #166534; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
  .stat-title { font-size: 13px; color: #6b7280; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 800; color: #111827; }
  
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { background: #f9fafb; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
  td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  
  .action-btns { display: flex; gap: 8px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; color: #fff; }
  .btn-confirm { background: #10b981; }
  .btn-confirm:hover { background: #059669; }
  .btn-reject { background: #ef4444; }
  .btn-reject:hover { background: #dc2626; }
  .btn-sm:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-screen" class="login-box">
  <div class="login-title">VIRUS <span>⚡</span> MLM <br><span style="font-size: 14px; font-weight: normal; color: #6b7280;">Operator VIP Panel</span></div>
  
  <div class="form-group">
    <label>Логин</label>
    <input type="text" id="username" placeholder="admin">
  </div>
  <div class="form-group">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  
  <button class="btn" onclick="handleLogin()">Войти</button>
</div>

<!-- ЭКРАН АДМИНКИ -->
<div id="admin-screen">
  <div class="navbar">
    <div class="nav-brand">VIRUS <span>⚡</span> MLM — VIP Admin</div>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <div class="container">
    <!-- Блок подключения Web3 -->
    <div class="web3-panel">
      <div class="web3-status" id="web3-status">Кошелёк не подключен</div>
      <button class="btn" style="width: auto; padding: 8px 16px;" id="btn-connect" onclick="connectWallet()">Подключить MetaMask</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Ожидают</div>
        <div class="stat-value" style="color: #d97706;" id="stat-pending">1</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Активных VIP</div>
        <div class="stat-value" style="color: #059669;" id="stat-active">0</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Кошелёк</th>
          <th>Уровень</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="vip-table-body">
        <!-- Сюда будут падать заявки -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // --- КОНСТАНТЫ ---
  const BSC_TESTNET = {
    chainId: '0x61',
    chainName: 'BSC Testnet',
    nativeCurrency: { name: 'BNB', symbol: 'tBNB', decimals: 18 },
    rpcUrls: ['https://data-seed-prebsc-1-s1.binance.org:8545/'],
    blockExplorerUrls: ['https://testnet.bscscan.com/']
  };

  const VIRUS_MLM_TESTNET = '0x9aE8cb4c0915c9d44B004707A79EF79D7B2aB065';
  const VIRUS_MLM_ABI = [
    'function confirmVip(address _user, uint256 _starLevel) external',
    'function hasRole(bytes32 role, address account) view returns (bool)',
    'function VIP_ADMIN_ROLE() view returns (bytes32)'
  ];

  let provider = null;
  let signer = null;
  let userAddress = null;

  // --- АВТОРИЗАЦИЯ В ПАНЕЛИ ---
  function handleLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    if (!user || !pass) return alert('Введите логин и пароль');
    
    // Демо-вход (пока без бэкенда)
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    
    // Загружаем демо-заявку
    loadDemoRequests();
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-screen').style.display = 'none';
    // Сброс Web3
    provider = null; signer = null; userAddress = null;
    document.getElementById('web3-status').textContent = 'Кошелёк не подключен';
    document.getElementById('btn-connect').disabled = false;
    document.getElementById('vip-table-body').innerHTML = '';
  }

  // --- WEB3 ЛОГИКА ---
  async function connectWallet() {
    if (!window.ethereum) return alert('MetaMask не найден');

    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAddress = accounts[0];

      const chainId = await window.ethereum.request({ method: 'eth_chainId' });
      if (chainId !== BSC_TESTNET.chainId) {
        try {
          await window.ethereum.request({
            method: 'wallet_switchEthereumChain',
            params: [{ chainId: BSC_TESTNET.chainId }]
          });
        } catch (switchError) {
          if (switchError.code === 4902) {
            await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [BSC_TESTNET] });
          } else {
            throw switchError;
          }
        }
      }

      signer = await provider.getSigner();

      // Проверка роли VIP_ADMIN
      const contract = new ethers.Contract(VIRUS_MLM_TESTNET, VIRUS_MLM_ABI, provider);
      const adminRole = await contract.VIP_ADMIN_ROLE();
      const isAdmin = await contract.hasRole(adminRole, userAddress);

      if (!isAdmin) {
        alert('⚠️ Ваш кошелёк не имеет роли VIP_ADMIN. Кнопки будут заблокированы.');
        document.getElementById('web3-status').textContent = 'Кошелёк: ' + userAddress.slice(0,6) + '... (НЕТ ПРАВ)';
        document.getElementById('web3-status').style.color = '#dc2626';
        // Блокируем кнопки в таблице, если они есть
        document.querySelectorAll('.btn-confirm').forEach(b => b.disabled = true);
      } else {
        document.getElementById('web3-status').textContent = 'Кошелёк: ' + userAddress.slice(0,6) + '... (Админ)';
        document.getElementById('web3-status').style.color = '#166534';
        document.querySelectorAll('.btn-confirm').forEach(b => b.disabled = false);
      }

      document.getElementById('btn-connect').disabled = true;
      document.getElementById('btn-connect').textContent = 'Подключено';

    } catch (e) {
      console.error(e);
      alert('Ошибка подключения: ' + e.message);
    }
  }

  // --- ЗАГРУЗКА ДЕМО-ЗАЯВКИ ---
  function loadDemoRequests() {
    const tbody = document.getElementById('vip-table-body');
    tbody.innerHTML = `
      <tr>
        <td><b>0xbe9e...451a</b></td>
        <td>1 ★</td>
        <td><span class="badge badge-pending">Ожидает</span></td>
        <td>
          <div class="action-btns">
            <button class="btn-sm btn-confirm" onclick="confirmVip('0xBE9E0e7036cd9e63c5b244e055F8A94C2b20451A', 1)">Одобрить</button>
            <button class="btn-sm btn-reject" onclick="alert('Заявка отклонена (демо)')">Отклонить</button>
          </div>
        </td>
      </tr>
    `;
  }

  // --- ВЫЗОВ КОНТРАКТА (ОДОБРИТЬ) ---
  async function confirmVip(userAddressToConfirm, starLevel) {
    if (!signer) return alert('Сначала подключите MetaMask');

    try {
      const contract = new ethers.Contract(VIRUS_MLM_TESTNET, VIRUS_MLM_ABI, signer);
      
      // Вызов транзакции confirmVip
      const tx = await contract.confirmVip(userAddressToConfirm, starLevel);
      
      // Ждем подтверждения
      await tx.wait();
      
      alert('✅ VIP подтвержден в блокчейне!');
      
      // Обновляем таблицу (в демо просто убираем строку)
      event.target.closest('tr').remove();
      document.getElementById('stat-pending').textContent = '0';
      document.getElementById('stat-active').textContent = '1';

    } catch (e) {
      console.error(e);
      let msg = e.reason || e.message;
      if (msg.includes('Not VIP admin')) msg = 'У вас нет прав VIP_ADMIN';
      if (msg.includes('Packet too low')) msg = 'У пользователя слишком низкий пакет для VIP';
      alert('Ошибка: ' + msg);
    }
  }
</script>

</body>
</html>
