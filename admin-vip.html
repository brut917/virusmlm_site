<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS MLM — Admin VIP (Web3)</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f3f4f6; color: #1f2937; min-height: 100vh; }

  /* Экран входа */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #111827; }
  .login-box { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .login-title { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 24px; color: #111827; }
  .login-title span { color: #f59e0b; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
  .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  
  /* Экран админки */
  #admin-screen { display: none; }
  .navbar { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-size: 18px; font-weight: 800; color: #111827; }
  .nav-brand span { color: #f59e0b; }
  .nav-user { font-size: 13px; color: #6b7280; display: flex; align-items: center; gap: 16px; }
  .btn-logout { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

  .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
  
  .web3-panel { background: #ffffff; border: 1px solid #e5e7eb; padding: 16px 20px; border-radius: 8px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .web3-status { font-size: 14px; font-weight: 600; color: #374151; }

  .table-wrapper { background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { background: #f9fafb; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
  td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  
  .action-btns { display: flex; gap: 8px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; color: #fff; font-weight: 600; }
  .btn-confirm { background: #10b981; }
  .btn-confirm:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">VIRUS <span>⚡</span> MLM <br><span style="font-size: 14px; font-weight: normal; color: #6b7280;">Operator VIP</span></div>
    <div class="form-group">
      <label>Логин</label>
      <input type="text" id="username" placeholder="admin">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn" onclick="handleLogin()">Войти</button>
  </div>
</div>

<!-- ЭКРАН АДМИНКИ -->
<div id="admin-screen">
  <div class="navbar">
    <div class="nav-brand">VIRUS <span>⚡</span> MLM — VIP Admin</div>
    <div class="nav-user">
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>
  </div>

  <div class="container">
    <div class="web3-panel">
      <div class="web3-status" id="web3-status">Кошелёк не подключен</div>
      <button class="btn" style="width: auto; padding: 8px 16px;" id="btn-connect" onclick="connectWallet()">Подключить MetaMask</button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Кошелёк</th>
            <th>Уровень</th>
            <th>Статус</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="vip-table-body">
          <tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Подключите кошелёк для загрузки заявок...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const BSC_TESTNET = {
    chainId: '0x61',
    chainName: 'BSC Testnet',
    nativeCurrency: { name: 'BNB', symbol: 'tBNB', decimals: 18 },
    rpcUrls: ['https://data-seed-prebsc-1-s1.binance.org:8545/'],
    blockExplorerUrls: ['https://testnet.bscscan.com/']
  };

  const VIRUS_MLM_TESTNET = '0x9aE8cb4c0915c9d44B004707A79EF79D7B2aB065';
  const VIRUS_MLM_ABI = [
    'function confirmVip(address _user, uint256 _starLevel) external',
    'function hasRole(bytes32 role, address account) view returns (bool)',
    'function VIP_ADMIN_ROLE() view returns (bytes32)',
    'event VipRequested(address indexed user, uint256 starLevel)'
  ];

  let provider = null;
  let signer = null;
  let userAddress = null;

  function handleLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    if (!user || !pass) return alert('Введите логин и пароль');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
  }

  function logout() {
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('web3-status').textContent = 'Кошелёк не подключен';
    document.getElementById('btn-connect').disabled = false;
    document.getElementById('vip-table-body').innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Подключите кошелёк...</td></tr>';
  }

  async function connectWallet() {
    if (!window.ethereum) return alert('MetaMask не найден');
    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAddress = accounts[0];

      const chainId = await window.ethereum.request({ method: 'eth_chainId' });
      if (chainId !== BSC_TESTNET.chainId) {
        await window.ethereum.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: BSC_TESTNET.chainId }]
        });
      }

      signer = await provider.getSigner();

      // Проверяем права
      const contract = new ethers.Contract(VIRUS_MLM_TESTNET, VIRUS_MLM_ABI, provider);
      const adminRole = await contract.VIP_ADMIN_ROLE();
      const isAdmin = await contract.hasRole(adminRole, userAddress);

      if (!isAdmin) {
        alert('⚠️ У вашего кошелька нет прав VIP_ADMIN.');
        document.getElementById('web3-status').textContent = userAddress.slice(0,6) + '... (Нет прав)';
        document.getElementById('web3-status').style.color = '#dc2626';
        document.querySelectorAll('.btn-confirm').forEach(b => b.disabled = true);
      } else {
        document.getElementById('web3-status').textContent = userAddress.slice(0,6) + '... (Админ)';
        document.getElementById('web3-status').style.color = '#166534';
        document.getElementById('btn-connect').disabled = true;
        document.getElementById('btn-connect').textContent = 'Подключено';
        loadVipRequests();
      }

    } catch (e) {
      alert('Ошибка подключения: ' + e.message);
    }
  }

  async function loadVipRequests() {
    const tbody = document.getElementById('vip-table-body');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Загрузка событий из блокчейна...</td></tr>';

    try {
      const contract = new ethers.Contract(VIRUS_MLM_TESTNET, VIRUS_MLM_ABI, provider);
      
      // Ищем события VipRequested за последние 10000 блоков
      const currentBlock = await provider.getBlockNumber();
      const fromBlock = currentBlock - 10000;
      
      const events = await contract.queryFilter('VipRequested', fromBlock, currentBlock);
      
      if (events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #6b7280;">Нет активных заявок на VIP</td></tr>';
        return;
      }

      // Отрисовываем (берем последние 10 событий)
      tbody.innerHTML = events.slice(-10).reverse().map(ev => {
        const user = ev.args[0];
        const level = ev.args[1].toString();
        return `
          <tr>
            <td><b>${user.slice(0,6)}...${user.slice(-4)}</b></td>
            <td>${level} ★</td>
            <td><span class="badge badge-pending">Ожидает</span></td>
            <td>
              <div class="action-btns">
                <button class="btn-sm btn-confirm" onclick="confirmVip('${user}', ${level}, this)">Одобрить</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
      
    } catch (e) {
      console.error(e);
      tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px; color: #dc2626;">Ошибка загрузки: ${e.message}</td></tr>`;
    }
  }

  async function confirmVip(targetAddress, starLevel, btnElement) {
    if (!signer) return alert('Сначала подключите MetaMask');
    if (!confirm(`Подтвердить VIP ${starLevel}★ для ${targetAddress.slice(0,6)}...?`)) return;

    btnElement.disabled = true;
    btnElement.textContent = 'Ожидание...';

    try {
      const contract = new ethers.Contract(VIRUS_MLM_TESTNET, VIRUS_MLM_ABI, signer);
      const tx = await contract.confirmVip(targetAddress, starLevel);
      
      alert('Транзакция отправлена. Ожидание подтверждения...');
      await tx.wait();
      
      alert('✅ VIP успешно подтвержден в блокчейне!');
      btnElement.textContent = 'Готово';
      
    } catch (e) {
      let msg = e.reason || e.message;
      if (msg.includes('Not VIP admin')) msg = 'У вас нет прав VIP_ADMIN';
      alert('Ошибка: ' + msg);
      btnElement.disabled = false;
      btnElement.textContent = 'Одобрить';
    }
  }
</script>

</body>
</html>
