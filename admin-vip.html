<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS MLM — Admin VIP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f3f4f6; color: #1f2937; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  
  /* Экран входа */
  .login-box { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .login-title { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 24px; color: #111827; }
  .login-title span { color: #f59e0b; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
  
  .btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: #1d4ed8; }
  
  /* Экран админки */
  #admin-screen { display: none; width: 100%; max-width: 1000px; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
  .navbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { font-size: 18px; font-weight: 800; color: #111827; }
  .nav-brand span { color: #f59e0b; }
  .btn-logout { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  
  .container { padding: 24px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; text-align: center; }
  .stat-title { font-size: 13px; color: #6b7280; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 800; color: #111827; }
  
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { background: #f9fafb; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; }
  td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
  
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-pending { background: #fef3c7; color: #92400e; }
  
  .action-btns { display: flex; gap: 8px; }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; color: #fff; }
  .btn-confirm { background: #10b981; }
  .btn-reject { background: #ef4444; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login-screen" class="login-box">
  <div class="login-title">VIRUS <span>⚡</span> MLM <br><span style="font-size: 14px; font-weight: normal; color: #6b7280;">Operator VIP Panel</span></div>
  
  <div class="form-group">
    <label>Логин</label>
    <input type="text" id="username" placeholder="admin">
  </div>
  <div class="form-group">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <div class="form-group" id="2fa-group" style="display: none;">
    <label>Код 2FA</label>
    <input type="text" id="totp" placeholder="000000" maxlength="6" style="text-align: center; letter-spacing: 4px;">
  </div>
  
  <button class="btn" onclick="handleLogin()">Войти</button>
</div>

<!-- ЭКРАН АДМИНКИ -->
<div id="admin-screen">
  <div class="navbar">
    <div class="nav-brand">VIRUS <span>⚡</span> MLM — VIP Admin</div>
    <button class="btn-logout" onclick="logout()">Выйти</button>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Ожидают</div>
        <div class="stat-value" style="color: #d97706;">1</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Активных VIP</div>
        <div class="stat-value" style="color: #059669;">0</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Кошелёк</th>
          <th>Уровень</th>
          <th>Статус</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><b>0xbe9e...451a</b></td>
          <td>1 ★</td>
          <td><span class="badge badge-pending">Ожидает</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-sm btn-confirm" onclick="alert('VIP подтвержден (демо)')">Одобрить</button>
              <button class="btn-sm btn-reject" onclick="alert('Заявка отклонена (демо)')">Отклонить</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function handleLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    
    if (!user || !pass) return alert('Введите логин и пароль');
    
    // Демо-вход (пока без бэкенда)
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('admin-screen').style.display = 'none';
  }
</script>

</body>
</html>
