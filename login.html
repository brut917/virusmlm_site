<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRUS MLM — Вход</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: #0a0e1a; color: #1a1a1a; min-height: 100vh; }

  .bg-hero { background: linear-gradient(180deg, #0a0e1a 0%, #0f1e3a 40%, #0a0e1a 100%); min-height: 100vh; }
  .header { position: relative; display: flex; align-items: center; justify-content: center; padding: 18px 20px; border-bottom: 1px solid #1f2937; background: linear-gradient(180deg, #0f1e3a, #0a0e1a); min-height: 62px; max-width: 640px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 2px; }
  .logo-text { font-weight: 800; font-size: 22px; letter-spacing: 2px; color: #fff; }
  .logo-bolt { font-size: 22px; color: #2196f3; filter: drop-shadow(0 0 8px #2196f3); margin: 0 2px; }

  .lang-switch { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 3px; align-items: center; }
  .lang-switch button { background: transparent; color: #6b7280; border: 1px solid #374151; border-radius: 5px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .lang-switch button.active { background: #2196f3; color: #fff; border-color: #2196f3; }

  .reg-container { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  .reg-logo { text-align: center; margin-bottom: 32px; }
  .reg-subtitle { font-size: 14px; color: #9ca3af; text-align: center; margin-bottom: 32px; }

  .input { width: 100%; padding: 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; color: #1a1a1a; font-size: 13px; margin-bottom: 10px; font-family: monospace; }
  .input:focus { outline: none; border-color: #2196f3; }
  .input::placeholder { color: #9ca3af; font-family: sans-serif; }

  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
  .btn-blue { background: #2196f3; color: #fff; }
  .btn-blue:hover { box-shadow: 0 0 20px rgba(33,150,243,0.5); }
  .btn-blue:disabled { background: #4b5563; cursor: not-allowed; box-shadow: none; }
  .btn-green { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: #fff; }
  .btn-green:hover { box-shadow: 0 0 25px rgba(46,125,50,0.6); }
  .btn-green:disabled { background: #4b5563; cursor: not-allowed; box-shadow: none; }

  .captcha-wrap { margin: 12px 0; display: flex; justify-content: center; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin: 12px 0; line-height: 1.5; display: none; }
  .alert.error { background: #7f1d1d; color: #fecaca; display: block; }
  .alert.success { background: #14532d; color: #bbf7d0; display: block; }
  .alert.info { background: #1e3a8a; color: #bfdbfe; display: block; }

  .login-link { text-align: center; margin-top: 20px; font-size: 13px; color: #9ca3af; }
  .login-link a { color: #2196f3; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) { .logo-text { font-size: 19px; } }
</style>
</head>
<body>

<div class="bg-hero">
  <div class="header">
    <div class="logo">
      <div class="logo-text">VIRUS<span class="logo-bolt">⚡</span>MLM</div>
    </div>
    <div class="lang-switch">
      <button class="active" id="lang-ru" onclick="setLang('ru')">RU</button>
      <button id="lang-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="reg-container">
    <div class="reg-logo">
      <div class="reg-subtitle" id="subtitle">Вход в виртуальный кабинет</div>
    </div>

    <div id="alert-box" class="alert"></div>

    <input type="email" class="input" placeholder="Введите email" id="email">
    <button class="btn btn-blue" id="btn-send" onclick="handleSendCode()">Получить код на email</button>

    <input type="text" class="input" placeholder="Введите код из письма" id="code" style="margin-top:12px;">

    <div class="captcha-wrap">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFQoVElxKXtVNUcR" data-theme="dark" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired"></div>
    </div>

    <button class="btn btn-green" id="btn-login" onclick="handleLogin()">ВОЙТИ</button>

    <div class="login-link" id="login-link-container">
      Нет аккаунта? <a href="index.html" id="login-link-text">Зарегистрироваться</a>
    </div>
  </div>
</div>

<script src="api.js"></script>

<script>
  let turnstileToken = null;
  function onTurnstileSuccess(token) { turnstileToken = token; }
  function onTurnstileExpired() { turnstileToken = null; }
  function resetTurnstile() { turnstileToken = null; if (window.turnstile) { try { window.turnstile.reset(); } catch (e) {} } }

  const i18n = {
    ru: {
      subtitle: "Вход в виртуальный кабинет",
      send_code: "Получить код на email",
      login_btn: "ВОЙТИ",
      placeholder_email: "Введите email",
      placeholder_code: "Введите код из письма",
      login_text: "Нет аккаунта? <a href='index.html' id='login-link-text'>Зарегистрироваться</a>"
    },
    en: {
      subtitle: "Sign in to virtual cabinet",
      send_code: "Get code by email",
      login_btn: "SIGN IN",
      placeholder_email: "Enter email",
      placeholder_code: "Enter code from email",
      login_text: "No account? <a href='index.html' id='login-link-text'>Register</a>"
    }
  };

  let currentLang = 'ru';

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('subtitle').textContent = i18n[lang].subtitle;
    document.getElementById('btn-send').textContent = i18n[lang].send_code;
    document.getElementById('btn-login').textContent = i18n[lang].login_btn;
    document.getElementById('email').placeholder = i18n[lang].placeholder_email;
    document.getElementById('code').placeholder = i18n[lang].placeholder_code;
    document.getElementById('login-link-container').innerHTML = i18n[lang].login_text;

    document.querySelectorAll('.lang-switch button').forEach((b) => b.classList.remove('active'));
    document.getElementById('lang-' + lang).classList.add('active');
    localStorage.setItem('virusmlm_lang', lang);
  }

  const savedLang = localStorage.getItem('virusmlm_lang');
  if (savedLang && i18n[savedLang]) { setLang(savedLang); }

  function showAlert(type, message) {
    const box = document.getElementById('alert-box');
    box.className = 'alert ' + type;
    box.textContent = message;
  }
  function hideAlert() {
    const box = document.getElementById('alert-box');
    box.className = 'alert';
    box.textContent = '';
  }
  function setLoading(btnId, loading, loadingText) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + (loadingText || 'Подождите...');
    } else {
      btn.disabled = false;
    }
  }

  if (api.isAuthenticated()) { window.location.href = 'cabinet.html'; }

  async function handleSendCode() {
    hideAlert();
    const email = document.getElementById('email').value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('error', 'Введите корректный email'); return; }
    if (!turnstileToken) { showAlert('error', 'Пройдите проверку Cloudflare Turnstile'); return; }

    setLoading('btn-send', true, 'Отправка...');
    try {
      await api.login(email, turnstileToken);
      showAlert('success', 'Код отправлен на ' + email + '. Проверьте почту.');
      document.getElementById('code').focus();
      resetTurnstile();
    } catch (error) {
      if (error.code === 'NOT_FOUND') { showAlert('error', 'Аккаунт не найден. Зарегистрируйтесь.'); }
      else if (error.code === 'TOO_MANY_REQUESTS') { showAlert('error', error.message || 'Подождите минуту.'); }
      else if ((error.message || '').toLowerCase().includes('captcha')) { showAlert('error', 'Ошибка капчи. Обновите страницу.'); }
      else { showAlert('error', error.message || 'Ошибка отправки кода.'); }
      resetTurnstile();
    } finally {
      setLoading('btn-send', false);
      document.getElementById('btn-send').textContent = i18n[currentLang].send_code;
    }
  }

  async function handleLogin() {
    hideAlert();
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('error', 'Введите корректный email'); return; }
    if (!code || !/^\d{6}$/.test(code)) { showAlert('error', 'Введите 6-значный код из письма'); return; }

    setLoading('btn-login', true, 'Вход...');
    try {
      await api.loginVerify(email, code);
      showAlert('success', 'Вход выполнен! Переход в кабинет...');
      setTimeout(() => { window.location.href = 'cabinet.html'; }, 600);
    } catch (error) {
      switch (error.code) {
        case 'CODE_NOT_FOUND': showAlert('error', 'Код не найден или истёк. Запросите новый.'); break;
        case 'CODE_INVALID': showAlert('error', 'Неверный код. Попробуйте снова.'); break;
        case 'TOO_MANY_ATTEMPTS': showAlert('error', 'Слишком много попыток. Запросите новый код.'); break;
        case 'UNAUTHORIZED': showAlert('error', 'Пользователь не найден.'); break;
        default: showAlert('error', error.message || 'Ошибка входа.');
      }
    } finally {
      setLoading('btn-login', false);
      document.getElementById('btn-login').textContent = i18n[currentLang].login_btn;
    }
  }
</script>

</body>
</html>
